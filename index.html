<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <style>
      html, body { margin: 0; background: #101211; }
      .loading-screen { position: fixed; inset: 0; z-index: 20; background: #101211; }
      .loading-content { opacity: 0; }
    </style>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Yuliia Nerubenko Portfolio Demo</title>
  </head>
  <body>
    <main id="app">
      <section id="loading-screen" class="loading-screen" aria-live="polite" aria-label="Application loading status">
        <div class="loading-content">
          <div class="loading-indicator" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="loading-hint">A little magic is on the way</p>
        </div>
      </section>

      <nav class="tab-nav" aria-label="Application tabs">
        <button class="tab-button is-active" type="button" data-tab="gallery" aria-pressed="true">Gallery</button>
        <button class="tab-button" type="button" data-tab="slot-demo" aria-pressed="false">Slot Demo</button>
      </nav>

      <div class="stage-shell">
        <div id="game-root" aria-label="Animated symbol gallery"></div>

        <div class="slot-demo-ui" aria-label="Slot demo controls and artist credit">
          <div id="slot-controls" class="slot-controls is-hidden">
            <button id="spin-button" class="spin-button" type="button" disabled>Spin</button>
            <button id="spin-win-button" class="spin-button spin-win-button" type="button" disabled>Spin & Win</button>
          </div>

          <aside class="artist-badge" aria-label="Artist credit">
            2D Animation by <a href="%BASE_URL%artist.html">Yuliia Nerubenko</a>
          </aside>
        </div>
      </div>

      <div class="gallery-sidebar">
        <section id="gallery-panel" class="settings-panel" aria-label="Symbol gallery settings">
          <div class="primary-control-group" aria-label="Symbol animation controls">
            <div class="settings-section primary-section" aria-label="Symbol selector">
              <h2>Symbol</h2>
              <div id="symbol-buttons" class="symbol-group"></div>
            </div>

            <div class="settings-section primary-section" aria-label="Animation selector">
              <h2>Animation</h2>
              <div class="segmented-control">
                <button class="control-button" type="button" data-animation="Idle" aria-pressed="false">Idle</button>
                <button class="control-button is-active" type="button" data-animation="Win" aria-pressed="true">Win</button>
              </div>
            </div>
          </div>

        </section>

        <aside class="gallery-credit" aria-label="Artist credit">
          2D Animation by <a href="%BASE_URL%artist.html">Yuliia Nerubenko</a>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
